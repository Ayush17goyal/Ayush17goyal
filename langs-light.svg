<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="480" height="344" role="img" aria-label="Most Used Languages">
<title>Most Used Languages</title>
<defs>
<linearGradient id="lge_bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAFBFF"/><stop offset="100%" stop-color="#F3F4FB"/></linearGradient>
<filter id="lge_bl" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="34"/></filter>
<clipPath id="lge_cl"><rect width="480" height="344" rx="20"/></clipPath>
</defs>
<g clip-path="url(#lge_cl)">
<rect width="480" height="344" fill="url(#lge_bg)"/>
<rect width="480" height="344" fill="none" stroke="#6D28D93D"/>
<circle cx="440" cy="20" r="120" filter="url(#lge_bl)" fill="#6D28D9" opacity="0.12"/>
<text x="24" y="34" font-family="'Segoe UI',ui-sans-serif,system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#12131F">Most Used Languages</text>
<circle cx="458" cy="30" r="3.4" fill="#059669"><animate attributeName="opacity" values="0.4;1;0.4" keyTimes="0;0.5;1" dur="2.4s" repeatCount="indefinite"/></circle>
