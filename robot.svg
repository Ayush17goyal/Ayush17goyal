<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-label="AI Robot">
<title>AI Robot — N-CYPHER</title>
<defs>
  <!-- Glows -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
  <!-- Gradients -->
  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1A1F3A"/>
    <stop offset="100%" stop-color="#0D1020"/>
  </linearGradient>
  <linearGradient id="platingGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#252A4A"/>
    <stop offset="100%" stop-color="#151830"/>
  </linearGradient>
  <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#8B5CF6"/>
  </linearGradient>
  <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="40%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#0891B2"/>
  </radialGradient>
  <radialGradient id="chestGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1"/>
  </radialGradient>
  <clipPath id="robotClip"><rect width="320" height="420" rx="20"/></clipPath>
</defs>

<style>
  @keyframes pulse    { 0%,100%{opacity:0.6} 50%{opacity:1} }
  @keyframes eyePulse { 0%,100%{opacity:0.8;r:5} 50%{opacity:1;r:6} }
  @keyframes float    { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes floatSlow{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  @keyframes spinRev  { from{transform:rotate(0deg)} to{transform:rotate(-360deg)} }
  @keyframes scanLine { 0%{transform:translateY(0);opacity:0.8} 100%{transform:translateY(120px);opacity:0} }
  @keyframes blink    { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(0.08)} }
  @keyframes armSwing { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }
  @keyframes dataFlow { 0%{stroke-dashoffset:200} 100%{stroke-dashoffset:0} }
  @keyframes orbOrbit { 0%{transform:rotate(0deg) translateX(52px) rotate(0deg)} 100%{transform:rotate(360deg) translateX(52px) rotate(-360deg)} }
  @keyframes orbOrbitRev { 0%{transform:rotate(0deg) translateX(68px) rotate(0deg)} 100%{transform:rotate(-360deg) translateX(68px) rotate(360deg)} }
  @keyframes fadeIn   { 0%{opacity:0} 100%{opacity:1} }
  @keyframes chestPulse { 0%,100%{opacity:0.4;r:14} 50%{opacity:0.9;r:18} }
  @keyframes particleDrift { 0%{transform:translate(0,0);opacity:0} 20%{opacity:0.8} 100%{transform:translate(var(--dx),var(--dy));opacity:0} }
  @keyframes ledBlink { 0%,100%{fill:#22D3EE} 50%{fill:#8B5CF6} }
  @keyframes handFloat{ 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-4px) rotate(2deg)} }

  .robot-body { animation: floatSlow 3s ease-in-out infinite; transform-origin:160px 210px; }
  .eye-l      { animation: pulse 1.8s ease-in-out infinite; }
  .eye-r      { animation: pulse 1.8s ease-in-out 0.3s infinite; }
  .blink-l,.blink-r { animation: blink 4s ease-in-out infinite; transform-origin: center; }
  .arm-l      { animation: armSwing 2.5s ease-in-out infinite; transform-origin: 88px 195px; }
  .arm-r      { animation: armSwing 2.5s ease-in-out 1.25s infinite; transform-origin: 232px 195px; }
  .ring1      { animation: spin 6s linear infinite; transform-origin: 160px 155px; }
  .ring2      { animation: spinRev 4s linear infinite; transform-origin: 160px 155px; }
  .orb1       { animation: orbOrbit 5s linear infinite; transform-origin: 160px 155px; }
  .orb2       { animation: orbOrbitRev 7s linear infinite; transform-origin: 160px 155px; }
  .chest-glow { animation: chestPulse 2s ease-in-out infinite; }
  .scan       { animation: scanLine 2.5s linear infinite; }
  .led1       { animation: ledBlink 1.2s ease-in-out infinite; }
  .led2       { animation: ledBlink 1.2s ease-in-out 0.4s infinite; }
  .led3       { animation: ledBlink 1.2s ease-in-out 0.8s infinite; }
  .data-line  { animation: dataFlow 2s linear infinite; stroke-dasharray: 6 4; }
  .hand       { animation: handFloat 3s ease-in-out infinite; transform-origin: 240px 310px; }
</style>

<g clip-path="url(#robotClip)">
<!-- Background transparent -->

<!-- Ambient orb glow (bg) -->
<circle cx="160" cy="210" r="140" fill="#8B5CF6" opacity="0.04" filter="url(#softglow)"/>
<circle cx="160" cy="155" r="60" fill="#22D3EE" opacity="0.06" filter="url(#softglow)"/>

<!-- Grid lines (floor/bg) -->
<g opacity="0.07" stroke="#22D3EE" stroke-width="0.5">
  <line x1="0" y1="380" x2="320" y2="380"/>
  <line x1="0" y1="395" x2="320" y2="395"/>
  <line x1="0" y1="410" x2="320" y2="410"/>
  <line x1="80" y1="370" x2="120" y2="420"/>
  <line x1="160" y1="370" x2="160" y2="420"/>
  <line x1="240" y1="370" x2="200" y2="420"/>
</g>

<!-- ===== ROBOT BODY (floating) ===== -->
<g class="robot-body">

  <!-- ORBITAL RINGS around head -->
  <g class="ring1">
    <ellipse cx="160" cy="155" rx="56" ry="14" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.5"/>
  </g>
  <g class="ring2">
    <ellipse cx="160" cy="155" rx="70" ry="18" fill="none" stroke="#8B5CF6" stroke-width="0.6" stroke-dasharray="3 5" opacity="0.4"/>
  </g>

  <!-- Orbiting dots -->
  <g class="orb1">
    <circle cx="160" cy="155" r="4" fill="#22D3EE" filter="url(#glow)" opacity="0.9"/>
  </g>
  <g class="orb2">
    <circle cx="160" cy="155" r="3" fill="#8B5CF6" filter="url(#glow)" opacity="0.8"/>
  </g>

  <!-- ── HEAD ── -->
  <!-- Head base shadow -->
  <rect x="110" y="82" width="100" height="86" rx="18" fill="#0D1020" opacity="0.6"/>
  <!-- Head body -->
  <rect x="108" y="80" width="104" height="86" rx="18" fill="url(#bodyGrad)" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Head top plate -->
  <rect x="120" y="80" width="80" height="18" rx="9" fill="url(#platingGrad)" stroke="#8B5CF640" stroke-width="0.8"/>
  <!-- Antenna -->
  <rect x="157" y="60" width="6" height="22" rx="3" fill="#1A1F3A" stroke="#22D3EE60" stroke-width="0.8"/>
  <circle cx="160" cy="57" r="5" fill="#22D3EE" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;6;4" dur="1.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Visor panel -->
  <rect x="120" y="104" width="80" height="32" rx="8" fill="#0A1525" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Eyes -->
  <g class="eye-l">
    <circle cx="141" cy="120" r="9" fill="#0A1525"/>
    <circle cx="141" cy="120" r="7" fill="url(#eyeGrad)" filter="url(#glow)"/>
    <circle cx="141" cy="120" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g class="blink-l">
    <rect x="132" y="116" width="18" height="8" rx="4" fill="#0A1525"/>
  </g>
  <g class="eye-r">
    <circle cx="179" cy="120" r="9" fill="#0A1525"/>
    <circle cx="179" cy="120" r="7" fill="url(#eyeGrad)" filter="url(#glow)"/>
    <circle cx="179" cy="120" r="3" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g class="blink-r">
    <rect x="170" y="116" width="18" height="8" rx="4" fill="#0A1525"/>
  </g>

  <!-- Mouth indicator bar -->
  <rect x="132" y="148" width="56" height="5" rx="2.5" fill="#22D3EE" opacity="0.3"/>
  <rect x="132" y="148" width="20" height="5" rx="2.5" fill="#22D3EE" class="led1"/>

  <!-- Side panels on head -->
  <rect x="108" y="100" width="12" height="24" rx="3" fill="#1A1F3A" stroke="#8B5CF640"/>
  <rect x="200" y="100" width="12" height="24" rx="3" fill="#1A1F3A" stroke="#8B5CF640"/>
  <circle cx="114" cy="112" r="3" fill="#22D3EE" class="led2" filter="url(#glow)" opacity="0.8"/>
  <circle cx="206" cy="112" r="3" fill="#8B5CF6" class="led3" filter="url(#glow)" opacity="0.8"/>

  <!-- ── NECK ── -->
  <rect x="146" y="164" width="28" height="18" rx="5" fill="url(#platingGrad)" stroke="#22D3EE40"/>
  <rect x="150" y="167" width="20" height="3" rx="1" fill="#22D3EE" opacity="0.5"/>
  <rect x="150" y="173" width="20" height="3" rx="1" fill="#22D3EE" opacity="0.3"/>

  <!-- ── TORSO ── -->
  <rect x="90" y="180" width="140" height="120" rx="16" fill="url(#bodyGrad)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4"/>
  <!-- Torso inner panels -->
  <rect x="98" y="188" width="124" height="104" rx="12" fill="#0D1020" opacity="0.5"/>
  <!-- Shoulder bolts -->
  <circle cx="98" cy="192" r="5" fill="#1A1F3A" stroke="#22D3EE40"/>
  <circle cx="222" cy="192" r="5" fill="#1A1F3A" stroke="#22D3EE40"/>

  <!-- Chest core reactor -->
  <circle cx="160" cy="230" r="22" fill="#0A1020" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="160" cy="230" r="18" fill="#0D1525" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.5"/>
  <circle class="chest-glow" cx="160" cy="230" fill="url(#chestGrad)" filter="url(#softglow)"/>
  <circle cx="160" cy="230" r="8" fill="#22D3EE" opacity="0.8" filter="url(#glow2)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Reactor ring -->
  <circle cx="160" cy="230" r="22" fill="none" stroke="#22D3EE" stroke-width="1" stroke-dasharray="4 3" class="ring1" opacity="0.6"/>

  <!-- Chest panel details -->
  <rect x="104" y="192" width="40" height="24" rx="5" fill="#12162A" stroke="#22D3EE30"/>
  <rect x="176" y="192" width="40" height="24" rx="5" fill="#12162A" stroke="#22D3EE30"/>
  <!-- LED indicators in panels -->
  <circle cx="114" cy="201" r="3" fill="#22D3EE" class="led1" filter="url(#glow)"/>
  <circle cx="125" cy="201" r="3" fill="#8B5CF6" class="led2" filter="url(#glow)"/>
  <circle cx="136" cy="201" r="3" fill="#22D3EE" class="led3" filter="url(#glow)"/>
  <rect x="108" y="207" width="28" height="3" rx="1" fill="#22D3EE30"/>
  <rect x="108" y="207" width="14" height="3" rx="1" fill="#22D3EE" class="led2"/>

  <circle cx="186" cy="201" r="3" fill="#8B5CF6" class="led3" filter="url(#glow)"/>
  <circle cx="197" cy="201" r="3" fill="#22D3EE" class="led1" filter="url(#glow)"/>
  <circle cx="208" cy="201" r="3" fill="#8B5CF6" class="led2" filter="url(#glow)"/>

  <!-- Circuit trace lines on torso -->
  <path d="M104 220 L130 220 L130 250" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.4" class="data-line"/>
  <path d="M216 220 L190 220 L190 250" fill="none" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.4" class="data-line"/>
  <path d="M120 270 L140 270 L140 285 L110 285" fill="none" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.3" class="data-line"/>

  <!-- Scan line across torso -->
  <rect x="90" y="180" width="140" height="3" rx="1" fill="#22D3EE" opacity="0" class="scan"/>

  <!-- Bottom torso vent -->
  <rect x="110" y="285" width="100" height="12" rx="4" fill="#0D1020" stroke="#22D3EE30"/>
  <rect x="115" y="288" width="8" height="6" rx="2" fill="#22D3EE20"/>
  <rect x="126" y="288" width="8" height="6" rx="2" fill="#8B5CF620"/>
  <rect x="137" y="288" width="8" height="6" rx="2" fill="#22D3EE20"/>
  <rect x="148" y="288" width="8" height="6" rx="2" fill="#8B5CF620"/>
  <rect x="159" y="288" width="8" height="6" rx="2" fill="#22D3EE20"/>
  <rect x="170" y="288" width="8" height="6" rx="2" fill="#8B5CF620"/>
  <rect x="181" y="288" width="8" height="6" rx="2" fill="#22D3EE20"/>
  <rect x="192" y="288" width="8" height="6" rx="2" fill="#8B5CF620"/>

  <!-- ── LEFT ARM ── -->
  <g class="arm-l">
    <!-- Shoulder -->
    <circle cx="88" cy="192" r="12" fill="url(#platingGrad)" stroke="#22D3EE40"/>
    <!-- Upper arm -->
    <rect x="74" y="192" width="26" height="55" rx="10" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
    <!-- Elbow joint -->
    <circle cx="87" cy="248" r="9" fill="url(#platingGrad)" stroke="#8B5CF640"/>
    <!-- Forearm -->
    <rect x="74" y="248" width="26" height="50" rx="9" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
    <!-- Arm LED strip -->
    <rect x="85" y="210" width="6" height="28" rx="3" fill="#22D3EE" opacity="0.2"/>
    <rect x="85" y="210" width="6" height="10" rx="3" fill="#22D3EE" class="led1" opacity="0.7"/>
    <!-- Hand -->
    <rect x="72" y="295" width="30" height="20" rx="7" fill="url(#platingGrad)" stroke="#22D3EE40"/>
    <!-- Fingers -->
    <rect x="74" y="313" width="5" height="14" rx="3" fill="url(#platingGrad)" stroke="#22D3EE30"/>
    <rect x="81" y="313" width="5" height="16" rx="3" fill="url(#platingGrad)" stroke="#22D3EE30"/>
    <rect x="88" y="313" width="5" height="15" rx="3" fill="url(#platingGrad)" stroke="#22D3EE30"/>
    <rect x="95" y="313" width="5" height="12" rx="3" fill="url(#platingGrad)" stroke="#22D3EE30"/>
  </g>

  <!-- ── RIGHT ARM (extended toward viewer) ── -->
  <g class="arm-r">
    <!-- Shoulder -->
    <circle cx="232" cy="192" r="12" fill="url(#platingGrad)" stroke="#22D3EE40"/>
    <!-- Upper arm angled out -->
    <rect x="220" y="192" width="26" height="55" rx="10" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
    <!-- Elbow joint -->
    <circle cx="233" cy="248" r="9" fill="url(#platingGrad)" stroke="#8B5CF640"/>
    <!-- Forearm -->
    <rect x="220" y="248" width="26" height="50" rx="9" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
    <!-- Arm LED -->
    <rect x="229" y="210" width="6" height="28" rx="3" fill="#8B5CF6" opacity="0.2"/>
    <rect x="229" y="210" width="6" height="10" rx="3" fill="#8B5CF6" class="led3" opacity="0.7"/>
    <!-- Hand open/extended -->
    <g class="hand">
      <rect x="218" y="295" width="30" height="20" rx="7" fill="url(#platingGrad)" stroke="#8B5CF640"/>
      <!-- Fingers spread -->
      <rect x="220" y="313" width="5" height="12" rx="3" fill="url(#platingGrad)" stroke="#8B5CF630"/>
      <rect x="227" y="313" width="5" height="16" rx="3" fill="url(#platingGrad)" stroke="#8B5CF630"/>
      <rect x="234" y="313" width="5" height="15" rx="3" fill="url(#platingGrad)" stroke="#8B5CF630"/>
      <rect x="241" y="313" width="5" height="12" rx="3" fill="url(#platingGrad)" stroke="#8B5CF630"/>
    </g>
  </g>

  <!-- ── LEGS ── -->
  <!-- Hip connector -->
  <rect x="120" y="298" width="30" height="14" rx="5" fill="url(#platingGrad)" stroke="#22D3EE30"/>
  <rect x="170" y="298" width="30" height="14" rx="5" fill="url(#platingGrad)" stroke="#22D3EE30"/>
  <!-- Left leg -->
  <rect x="118" y="310" width="32" height="58" rx="10" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
  <circle cx="134" cy="340" r="8" fill="url(#platingGrad)" stroke="#22D3EE30"/>
  <rect x="118" y="355" width="32" height="30" rx="8" fill="url(#bodyGrad)" stroke="#22D3EE30"/>
  <!-- Left foot -->
  <rect x="112" y="382" width="44" height="14" rx="6" fill="url(#platingGrad)" stroke="#22D3EE40"/>
  <!-- Right leg -->
  <rect x="170" y="310" width="32" height="58" rx="10" fill="url(#bodyGrad)" stroke="#22D3EE30" stroke-width="0.8"/>
  <circle cx="186" cy="340" r="8" fill="url(#platingGrad)" stroke="#22D3EE30"/>
  <rect x="170" y="355" width="32" height="30" rx="8" fill="url(#bodyGrad)" stroke="#22D3EE30"/>
  <!-- Right foot -->
  <rect x="164" y="382" width="44" height="14" rx="6" fill="url(#platingGrad)" stroke="#22D3EE40"/>

</g><!-- end robot-body -->

<!-- ── HOLOGRAPHIC ELEMENTS (fixed position) ── -->
<!-- Left holo panel -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.3;1" dur="3s" fill="freeze"/>
  <rect x="14" y="180" width="68" height="48" rx="6" fill="#22D3EE08" stroke="#22D3EE" stroke-width="0.8" stroke-opacity="0.5"/>
  <rect x="18" y="184" width="30" height="3" rx="1" fill="#22D3EE" opacity="0.6"/>
  <rect x="18" y="190" width="56" height="1.5" rx="1" fill="#22D3EE" opacity="0.3"/>
  <rect x="18" y="194" width="40" height="1.5" rx="1" fill="#8B5CF6" opacity="0.4"/>
  <rect x="18" y="198" width="50" height="1.5" rx="1" fill="#22D3EE" opacity="0.3"/>
  <rect x="18" y="202" width="35" height="1.5" rx="1" fill="#22D3EE" opacity="0.2"/>
  <text x="18" y="218" font-family="'Courier New',monospace" font-size="6" fill="#22D3EE" opacity="0.7">SYS.STATUS: ONLINE</text>
  <text x="18" y="224" font-family="'Courier New',monospace" font-size="6" fill="#8B5CF6" opacity="0.6">AI.CORE: ACTIVE</text>
</g>

<!-- Right holo panel -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0.7;0.7" keyTimes="0;0.4;1" dur="3.5s" fill="freeze"/>
  <rect x="238" y="180" width="68" height="48" rx="6" fill="#8B5CF608" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.5"/>
  <rect x="242" y="184" width="35" height="3" rx="1" fill="#8B5CF6" opacity="0.6"/>
  <rect x="242" y="190" width="56" height="1.5" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <rect x="242" y="194" width="44" height="1.5" rx="1" fill="#22D3EE" opacity="0.4"/>
  <rect x="242" y="198" width="38" height="1.5" rx="1" fill="#8B5CF6" opacity="0.3"/>
  <rect x="242" y="202" width="28" height="1.5" rx="1" fill="#22D3EE" opacity="0.2"/>
  <text x="242" y="218" font-family="'Courier New',monospace" font-size="6" fill="#8B5CF6" opacity="0.7">N-CYPHER.AI v2.4</text>
  <text x="242" y="224" font-family="'Courier New',monospace" font-size="6" fill="#22D3EE" opacity="0.6">NEURAL.NET: 98%</text>
</g>

<!-- Bottom label -->
<text x="160" y="412" text-anchor="middle" font-family="'Courier New',monospace" font-size="8" fill="#22D3EE" opacity="0.5" letter-spacing="3">N-CYPHER · AI UNIT</text>

<!-- Ambient particles -->
<g opacity="0.6">
  <circle cx="52" cy="120" r="1.5" fill="#22D3EE"><animate attributeName="cy" values="120;90;120" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="268" cy="100" r="1.5" fill="#8B5CF6"><animate attributeName="cy" values="100;70;100" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="40" cy="280" r="1" fill="#22D3EE"><animate attributeName="cy" values="280;250;280" dur="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="280" cy="260" r="1" fill="#8B5CF6"><animate attributeName="cy" values="260;230;260" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="160" cy="50" r="1.5" fill="#A78BFA"><animate attributeName="cy" values="50;20;50" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite"/></circle>
</g>

</g>
</svg>
